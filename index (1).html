<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0f10">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>أصول القطع</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 2l8.66 5v10L12 22l-8.66-5V7z' fill='%23ec4a40'/%3E%3Ccircle cx='12' cy='12' r='3.6' fill='%230e0f10'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
/* تخطيط: عمود واحد، منطقة رفع ثم جدول مقارنة عريض بعمود أول ثابت. الوضع الداكن فقط بقرار من المستخدم */
:root{
  --font-display:"Cairo","Segoe UI",Tahoma,sans-serif;
  --font-body:"Cairo","Segoe UI",Tahoma,system-ui,sans-serif;
  --bg:#0e0f10; --panel:#161718; --panel2:#1e2022; --line:#2d3033;
  --ink:#f3f1ea; --ink2:#a3a6a9; --accent:#ec4a40; --accent-ink:#fff; --accent-fill:#d6382f;
  --good:#46c795; --bad:#f0786a; --warn:#e9b44c;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15.5px;line-height:1.65}
button,input,select,textarea{font:inherit;color:inherit}
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;align-self:start;height:100vh;background:var(--panel);border-inline-end:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:22px}
.main{padding:24px 28px 60px;min-width:0;max-width:1400px;width:100%}
.brand{display:flex;align-items:center;justify-content:center;padding:4px 6px 0}
.brand .logo{display:block;flex:1 1 auto;width:100%;max-width:260px;aspect-ratio:262/84;height:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 17px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:#3a4752}
.btn.primary{background:var(--accent-fill);border-color:var(--accent-fill);color:var(--accent-ink);font-weight:700}
.btn.sm{padding:4px 11px;font-size:13.5px;border-radius:8px}
.btn.link{background:transparent;border-color:transparent;color:var(--ink2);text-decoration:underline;padding:4px 6px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.drop{border:2px dashed #34414b;border-radius:16px;background:var(--panel);padding:34px 20px;text-align:center;transition:border-color .15s,background .15s}
.drop.over{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--panel))}
.drop h2{margin:0 0 6px;font-size:21px;font-family:var(--font-display);font-weight:600}
.drop p{margin:0 0 16px;color:var(--ink2)}
.drop.mini{padding:14px 18px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;text-align:start}
.drop.mini p{margin:0}
.note{font-size:13px;color:var(--ink2);margin:10px 0 0}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;margin:14px 0;align-items:start}
.file{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.file .fh{display:flex;gap:10px;align-items:center}
.file .no{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13.5px;font-weight:700;background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.file input.nm{flex:1 1 auto;min-width:0;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-weight:700}
.file .x{flex:none;background:transparent;border:0;color:var(--ink2);cursor:pointer;font-size:13px;padding:4px 2px;text-decoration:underline;text-underline-offset:3px}
.file .x:hover{color:var(--bad)}
.file .fm{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13.5px;color:var(--ink2);padding-inline-start:38px}
.file .fm b{color:var(--ink);font-size:15px}
.file .warn{color:var(--warn);font-size:13.5px}
.file details{border-top:1px solid var(--line);padding-top:8px;margin-top:2px}
.file summary{cursor:pointer;color:var(--ink2);font-size:13.5px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:10px}
.cols label{display:block;font-size:12.5px;color:var(--ink2);margin-bottom:2px}
select,input[type=search],textarea,input[type=text]{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:18px 0}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.tile .l{font-size:13px;color:var(--ink2)}
.tile .v{font-family:var(--font-display);font-size:26px;line-height:1.3;font-variant-numeric:tabular-nums}
.tile .s{font-size:12.5px;color:var(--ink2)}
.tool{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:6px 0 12px}
.tool .grow{flex:1 1 240px}
.tool select{width:auto}
label.chk{display:inline-flex;gap:8px;align-items:center;color:var(--ink2);cursor:pointer}
input[type=checkbox]{accent-color:var(--accent)}
.cats{display:flex;flex-direction:column;gap:8px}
.cat{border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}
.cat>button.ch{all:unset;box-sizing:border-box;display:flex;width:100%;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;font-family:inherit;color:var(--ink)}
.cat>button.ch:hover{background:var(--panel2)}
.cat>button.ch:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.cat .ct{font-weight:700;font-size:16px}
.cat .cm{color:var(--ink2);font-size:13.5px}
.cat .cg{margin-inline-start:auto;transition:transform .15s;color:var(--ink2);display:grid}
.cat.open .cg{transform:rotate(180deg)}
.cat .tw{border:0;border-top:1px solid var(--line);border-radius:0;max-height:70vh}
.tw{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel);max-height:72vh}
table{border-collapse:separate;border-spacing:0;width:100%}
th,td{padding:10px 14px;border-bottom:1px solid var(--line);text-align:start;vertical-align:middle}
thead th{position:sticky;top:0;z-index:3;background:var(--panel2);color:var(--ink2);font-weight:500;font-size:13.5px;white-space:nowrap}
thead th.co{color:var(--ink);font-weight:700;background:color-mix(in srgb,var(--c) 38%,var(--panel2))}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-inline-end:7px;vertical-align:baseline}
td.p.has{background:color-mix(in srgb,var(--c) 20%,var(--panel));border-bottom-color:var(--panel);border-inline-start:2px solid var(--panel)}
td.p.best.has b{color:var(--ink)}
.mk{display:inline-block;vertical-align:middle;margin-inline-start:7px}
.mk.sq{width:11px;height:11px;border-radius:2px;background:var(--good)}
.mk.tri{margin-inline-end:10px;width:0;height:0;border-inline:6px solid transparent;border-bottom:10px solid var(--bad)}
.bn{display:inline-flex;align-items:center;margin-inline-end:10px;white-space:nowrap}
.file{background:color-mix(in srgb,var(--c,var(--panel)) 12%,var(--panel))}
.file .no{background:var(--c);color:#111}
th:first-child,td:first-child{position:sticky;inset-inline-start:0;z-index:2;background:var(--panel);min-width:220px;max-width:320px;box-shadow:-1px 0 0 var(--line)}
thead th:first-child{z-index:4;background:var(--panel2)}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#192026}
tbody tr:hover td:first-child{background:#192026}
td.p{min-width:120px;white-space:nowrap}
td.p b{font-variant-numeric:tabular-nums;font-size:18.5px}
td.p .b{font-size:12.5px;color:var(--ink2)}
td.p .u{unicode-bidi:isolate;direction:ltr;display:inline-block;font-size:12.5px;color:var(--bad);margin-inline-start:4px;font-variant-numeric:tabular-nums}
.no{font-size:12.5px;color:var(--ink2);direction:ltr;text-align:start}
.diff b{font-size:16.5px;font-variant-numeric:tabular-nums}
.chip{display:inline-block;padding:0 9px;border-radius:99px;font-size:12.5px;border:1px solid var(--line);background:var(--panel2);color:var(--ink2)}
.chip.hi{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line));background:color-mix(in srgb,var(--bad) 12%,transparent)}
.chip.mid{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,var(--line));background:color-mix(in srgb,var(--warn) 12%,transparent)}
.chip.lo{color:var(--good);border-color:color-mix(in srgb,var(--good) 40%,var(--line));background:color-mix(in srgb,var(--good) 12%,transparent)}
.mut{color:#5e6b76}
.paste{margin-top:14px;text-align:start}
.paste textarea{min-height:110px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);padding:0;width:min(760px,calc(100% - 24px))}
dialog::backdrop{background:rgba(5,8,10,.65)}
#offer{width:min(980px,calc(100% - 20px))}
#offer .b{padding:12px 16px}
#offer .tw{max-height:62vh}
.file .op{flex:none;padding:4px 12px;font-size:13.5px}
dialog .h{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
dialog .h b{font-family:var(--font-display);font-size:18px;font-weight:600}
dialog textarea{min-height:260px;direction:ltr;text-align:left;font-family:ui-monospace,Consolas,monospace;font-size:13px}
dialog .b{padding:16px 18px}
dialog .f{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px}
.toast{position:fixed;inset-inline:0;bottom:22px;display:flex;justify-content:center;pointer-events:none}
.toast span{background:var(--ink);color:var(--bg);padding:8px 18px;border-radius:99px;font-size:14px}

.tabs{display:flex;flex-direction:column;gap:4px}
.tabs button{display:flex;align-items:center;gap:10px;width:100%;background:transparent;border:0;border-radius:10px;padding:11px 12px;color:var(--ink2);cursor:pointer;font-weight:600;font-size:15.5px;text-align:start}
.tabs button svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button:hover{background:var(--panel2);color:var(--ink)}
.tabs button.on{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.tabs .n{margin-inline-start:auto;min-width:24px;text-align:center;font-size:12.5px;padding:0 7px;border-radius:99px;background:var(--panel2);color:var(--ink2)}
.tabs button.on .n{background:var(--accent-fill);color:#fff}
#hist h2{margin:0 0 4px;font-family:var(--font-display);font-size:22px;font-weight:700}
#hist .sub{margin:0 0 16px;color:var(--ink2);font-size:14px}
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.h-it{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--panel);display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.h-it.on{border-color:color-mix(in srgb,var(--good) 45%,var(--line))}
.h-n{font-weight:700;font-size:16.5px;overflow-wrap:anywhere}
.h-m{font-size:13px;color:var(--ink2)}
.h-a{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;align-items:center;justify-content:space-between;gap:10px;padding:12px;border-inline-end:0;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .brand{width:170px;padding:0}
  .tabs{flex-direction:row}
  .tabs button{width:auto;padding:8px 11px;font-size:14px}
  .tabs .n{margin-inline-start:2px}
  .main{padding:16px 12px 50px}
}
@media (max-width:640px){
  th:first-child,td:first-child{min-width:128px;max-width:140px;font-size:14px}
  th,td{padding:9px 8px}
  td.p{min-width:96px}
  .tiles{grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
  .tile{padding:9px 10px}
  .tile .l{font-size:11.5px;line-height:1.35}
  .tile .v{font-size:22px}
  .tile .v[style]{font-size:15px!important}
  .tile .s{font-size:11px}
  .files{gap:8px;margin:10px 0}
  .file{padding:10px 11px}
  .tool>*{flex:1 1 100%}
  .tool .btn,.tool select{flex:1 1 calc(50% - 5px)}
  .cat>button.ch{padding:12px}
  .cat .ct{font-size:15px}
  dialog{width:calc(100% - 12px)}
  #offer .b{padding:10px}
  #offer th:nth-child(3),#offer td:nth-child(3){display:none}
}
@media (max-width:380px){.tiles{grid-template-columns:1fr}}
@media (pointer:coarse){.btn,.tabs button,.cat>button.ch{min-height:44px}.btn.sm{min-height:38px}}
body{padding-bottom:env(safe-area-inset-bottom)}
@media (min-width:1500px){.main{max-width:1500px}}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand"><svg xmlns="http://www.w3.org/2000/svg" viewBox="62 0 262 84" direction="ltr" class="logo" role="img" aria-label="شركة أصول القطع - Osoul Parts Co."><defs><linearGradient id="lgBadge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f25a4f"/><stop offset="1" stop-color="#c62f27"/></linearGradient><linearGradient id="lgR" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff6a5c"/><stop offset="1" stop-color="#c92d25"/></linearGradient><linearGradient id="lgW" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#b9bcc0"/></linearGradient><linearGradient id="lgL" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#ec4a40"/><stop offset="1" stop-color="#ec4a40" stop-opacity="0"/></linearGradient></defs><g><text id="os-mark" x="280" y="56" text-anchor="middle" font-family="Montserrat,Cairo,'Segoe UI',Arial,sans-serif" font-weight="900" font-size="40" fill="#f3f1ea" textLength="60" lengthAdjust="spacingAndGlyphs">OS</text></g><text x="236" y="38" text-anchor="end" font-family="Cairo,'Segoe UI',Tahoma,sans-serif" font-weight="900" font-size="31" fill="#f3f1ea" textLength="168" lengthAdjust="spacingAndGlyphs">شركة أصول القطع</text><rect x="68" y="47.5" width="168" height="2" rx="1" fill="url(#lgL)" transform="translate(0 0)"/><text x="236" y="68" text-anchor="end" font-family="Cairo,'Segoe UI',Arial,sans-serif" font-weight="700" font-size="15" fill="#ec4a40" textLength="168" lengthAdjust="spacing">OSOUL PARTS CO.</text></svg></div>

<dialog id="dlg"><div class="h"><b id="dlg-t"></b><button class="btn sm" id="dlg-x">إغلاق</button></div><div class="b"><textarea id="dlg-a" readonly aria-label="النص"></textarea></div><div class="f"><button class="btn primary" id="dlg-c">نسخ</button></div></dialog>

<script>
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
const nf = new Intl.NumberFormat('en-US', { maximumFractionDigits: 2 });
const KEY = 'usool-simple-v1';
const NAMES_KEY = 'usool-names-v1';
const SEED_NAMES = {"الرقم|السعر|الصنف|رمز الصنف|كميه الطلب#hamaza alaseer": "اليت جروب", "اسم الصنف|السعر|رقم الصنف كميه الطلب#dell": "الثريا التجارية", "اسم الصنف|السعر الطلب|رقم الصنف|نوعه#user": "التوافق الماسية"};
const names = { get() { try { return JSON.parse(localStorage.getItem(NAMES_KEY) || '{}') || {}; } catch (e) { return {}; } }, set(sig, n) { if (!sig) return; try { const o = names.get(); o[sig] = n; localStorage.setItem(NAMES_KEY, JSON.stringify(o)); } catch (e) { } } };
const knownName = sig => sig ? (names.get()[sig] || SEED_NAMES[sig] || '') : '';
function headerSig(rows, hdr) { return hdr >= 0 && rows[hdr] ? 'x:' + rows[hdr].map(c => normAr(String(c ?? ''))).filter(Boolean).sort().join('|') : ''; }
const store = { get() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }, set(v) { try { localStorage.setItem(KEY, v); } catch (e) { } } };

/* ---------- تطبيع النصوص وقراءة الأرقام ---------- */
const MARKS = /[ً-ٰٟـ]/g;
const normAr = s => String(s ?? '').toLowerCase().replace(MARKS, '').replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[^\p{L}\p{N}\s]/gu, ' ').replace(/\s+/g, ' ').trim();
const codeKey = s => { const m = String(s ?? '').toUpperCase().match(/^\s*([A-Z0-9]{5})[-\s]?([A-Z0-9]{5})/); return m ? m[1] + m[2] : normNo(s); };
const headOf = d => (normAr(d).split(/\s+/)[0] || '').replace(/^ال/, '');
const CAT_MAP = { 'مقصات': 'مقص', 'فلترهواء': 'فلتر', 'فحمه': 'فحمات', 'جلدهعكس': 'جلده', 'تماتيك': 'اتماتيك', 'رومان': 'رمان', 'باكم': 'قماش', 'مساعدات': 'مساعد' };
const CAT_NAME = { 'قماش': 'الأقمشة', 'مقص': 'المقصات', 'مساعد': 'المساعدات', 'عكس': 'العكوس', 'علبه': 'العلب', 'فلنجه': 'الفلنجات', 'كرسي': 'الكراسي', 'طرمبه': 'الطرمبات', 'هوب': 'الهوبات', 'ذراع': 'الأذرع', 'دينمو': 'الدينمو', 'فحمات': 'الفحمات', 'جلبه': 'الجلب', 'سلف': 'السلف', 'فلتر': 'الفلاتر', 'مسمار': 'المسامير', 'حساس': 'الحساسات', 'شريحه': 'الشرائح', 'كويل': 'الكويلات', 'جلده': 'الجلد', 'لديتر': 'الرديترات', 'شداد': 'الشدادات', 'بكره': 'البكرات', 'صحن': 'الصحون', 'كمبروسر': 'الكمبروسرات', 'سلندر': 'السلندرات', 'دسك': 'الدسكات', 'سير': 'السيور', 'مروحه': 'المراوح', 'اتماتيك': 'الاتماتيك' };
const catOf = d => { const h = headOf(d); return CAT_MAP[h] || h || 'أخرى'; };
const normNo = s => String(s ?? '').toUpperCase().replace(/[^A-Z0-9]/g, '');
const toks = s => new Set(normAr(s).split(' ').filter(w => w.length > 1));
const sideOf = s => { const n = normAr(s); return n.includes('يمين') ? 'يمين' : (n.includes('يسار') ? 'يسار' : ''); };

}
function render() {

  if (page === 'history') $('#hist').innerHTML = viewHistory();

const pasteBox = () => `<div class="paste"><input type="text" id="pname" placeholder="اسم الشركة" aria-label="اسم الشركة" style="margin-bottom:8px"><textarea id="ptext" placeholder="الصق هنا جدولاً من Excel أو قائمة أسعار"></textarea><div style="margin-top:8px"><button class="btn primary sm" id="padd">إضافة</button></div></div>`;
function refreshResults() { const r = $('#res'); if (r) r.innerHTML = viewResults(); const q = $('#q'); }

/* ---------- إضافة الملفات ---------- */
async function addFile(file) {
  const nm = file.name || 'شركة', base = nm.replace(/\.[^.]+$/, '');
  try {
    const buf = await file.arrayBuffer(); let rows, extra = [], head = [];
    if (/\.pdf$/i.test(nm)) {
      try { rows = await pdfToRows(buf); head = rows.head || []; extra = rows.meta || []; } catch (e) { toast(e.message === 'nopdf' ? 'تعذر تحميل قارئ PDF. تأكد من الاتصال بالإنترنت.' : 'تعذرت قراءة ملف PDF: ' + nm); return; }
      if (!rows.length) { toast('لم أجد أسعاراً نصية في ' + nm + '. الملف على الأرجح صورة ممسوحة ضوئياً ولا يمكن قراءته هنا.'); return; }
    } else if (/\.(xlsx|xls|xlsm)$/i.test(nm)) {
      if (typeof XLSX === 'undefined') { toast('تعذر تحميل مكتبة Excel. احفظ الملف بصيغة CSV وارفعه.'); return; }
      const wb = XLSX.read(buf, { type: 'array' }); let best = [], bn = -1;
      wb.SheetNames.forEach(sn => { const r = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header: 1, raw: true, defval: '' }).filter(r => r.some(x => String(x ?? '').trim() !== '')); if (r.length > bn) { bn = r.length; best = r; } });
      rows = best; extra = [wb.Props && wb.Props.Company, wb.Props && wb.Props.Title, ...wb.SheetNames];
    } else {
      let text; try { text = new TextDecoder('utf-8', { fatal: true }).decode(buf); } catch (e) { text = new TextDecoder('windows-1256').decode(buf); }
      rows = parseText(text);
    }
    const id = addRows(rows, guessCompany(rows, extra, head) || 'شركة ' + (saved.length + 1), rows.sig);
    if (id) { const inp = document.querySelector('input[data-name="' + id + '"]'); if (inp) { inp.focus(); inp.select(); } }
  } catch (e) { toast('تعذرت قراءة الملف: ' + nm); }
}
function addRows(rows, name, sig) {
  rows = rows.filter(r => r.some(x => String(x ?? '').trim() !== '')).slice(0, 20000).map(r => r.map(x => typeof x === 'number' ? x : String(x ?? '')));
  if (!rows.length) { toast('لم أجد بيانات في الملف'); return; }
  const g = guessMap(rows), id = uid(); sig = sig || headerSig(rows, g.hdr); saved.push({ id, name: knownName(sig) || name, sig, rows, hdr: g.hdr, map: g.map, date: Date.now(), active: true }); sync(); save(); render(); return id;
}
const GEN = /^(microsoft|untitled|document|word|pdf|هاتف|جوال|العنوان|الرياض|جدة|الدمام|المملكة|ص\.?\s?ب|سجل|ضريب|فاتورة|الرقم|sheet|ورقة|صفحة|page|عرض|قائمة|كشف|تسعير|اسعار|أسعار|السعر|الصنف|البيان|اسم|رقم|الماركة|الماركه|الكمية|المجموع|تاريخ|شهر|نيسان|تويوتا|nissan|toyota|جدول|ملاحظ)/i;
const KEYWORD = /(شركة|مؤسسة|معرض|مصنع|مستودع)\s+/;
function cleanCo(t) {
  t = String(t ?? '').replace(/\s+/g, ' ').trim();
  t = t.replace(/^(عرض|قائمة|كشف)\s+(ال)?(أسعار|اسعار|سعر)\s*(لدى|من|ل)?\s*/, '');
  const m = t.match(KEYWORD); if (m) t = t.slice(m.index);
  t = t.split(/[-–—|:،,/\\(\d٠-٩]/)[0].trim();
  return t.length >= 3 && t.length <= 45 && !GEN.test(t) ? t : '';
}
function guessCompany(rows, extra, head) {
  for (const e of (extra || [])) { const t = cleanCo(e); if (t) return t; }
  head = head || [];
  for (const l of head) for (const c of l) { if (KEYWORD.test(c)) { const t = cleanCo(c); if (t) return t; } }
  for (const l of head.slice(0, 4)) for (const c of l) { const t = cleanCo(c); if (t) return t; }
  const top = rows.slice(0, 12);
  for (const r of top) for (const c of r) { const raw = String(c ?? ''); if (KEYWORD.test(raw)) { const t = cleanCo(raw); if (t) return t; } }
  for (const r of top.slice(0, 6)) {
    const cells = r.map(c => String(c ?? '').trim()).filter(Boolean);
    if (cells.length === 1) { const t = cleanCo(cells[0]); if (t) return t; }
  }
  return '';
}
async function addFiles(list) { for (const f of list) await addFile(f); }

/* ---------- فتح عرض شركة وحدها ---------- */
let openId = null;
function fillOffer() {
  const f = saved.find(x => x.id === openId); if (!f) return;
  const q = normAr($('#of-q').value), all = itemsOf(f), list = q ? all.filter(it => normAr(it.desc + ' ' + it.no + ' ' + (it.brand || '')).includes(q)) : all, LIM = 500;
  $('#of-b').innerHTML = list.slice(0, LIM).map(it => `<tr><td><span class="no">${esc(it.no || '')}</span></td><td>${esc(it.desc)}</td><td>${esc(it.brand || '')}</td><td class="p"><b>${nf.format(it.price)}</b></td></tr>`).join('') || '<tr><td colspan="4"><span class="mut">لا توجد أصناف مطابقة</span></td></tr>';

}
function openOffer(id) { const f = saved.find(x => x.id === id); if (!f) return; openId = id; $('#of-t').textContent = f.name; $('#of-q').value = ''; fillOffer(); $('#offer').showModal(); $('#of-b').parentElement.parentElement.scrollTop = 0; }
$('#of-x').addEventListener('click', () => $('#offer').close());
$('#offer').addEventListener('click', e => { if (e.target === e.currentTarget) e.currentTarget.close(); });
$('#of-q').addEventListener('input', fillOffer);

/* ---------- الأحداث ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.open) openOffer(t.dataset.open);
  else if (t.dataset.page) { page = t.dataset.page; try { location.hash = page === 'history' ? 'history' : 'compare'; } catch (x) { } render(); window.scrollTo(0, 0); }
  else if (t.id === 'pick') $('#file-in').click();
  else if (t.id === 'pastebtn') { ui.paste = !ui.paste; render(); }
  else if (t.id === 'padd') { const tx = $('#ptext').value; if (!tx.trim()) { toast('الصق النص أولاً'); return; } ui.paste = false; addRows(parseText(tx), $('#pname').value.trim() || 'شركة ' + (files.length + 1)); }

  else if (t.id === 'catall') { const keys = [...document.querySelectorAll('.cat > button.ch')].map(b => b.dataset.cat); if (ui.open.size >= keys.length) ui.open.clear(); else keys.forEach(k => ui.open.add(k)); refreshResults(); }
  else if (t.id === 'export') exportCsv();
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q') { ui.q = t.value; refreshResults(); const q = $('#q'); q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
  else if (t.dataset.name) { const f = files.find(x => x.id === t.dataset.name); if (f) { f.name = t.value; names.set(f.sig, t.value.trim()); save(); refreshResults(); } }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'file-in') { addFiles([...t.files]); t.value = ''; }
  else if (t.id === 'sort') { ui.sort = t.value; refreshResults(); }
  else if (t.id === 'single') { ui.single = t.checked; refreshResults(); }
  else if (t.dataset.col) { const [id, k] = t.dataset.col.split(':'), f = files.find(x => x.id === id); if (f) { f.map[k] = +t.value; save(); render(); } }
  else if (t.dataset.hdr) { const f = files.find(x => x.id === t.dataset.hdr); if (f) { f.hdr = +t.value; save(); render(); } }
});
['dragover', 'dragenter'].forEach(ev => document.addEventListener(ev, e => { e.preventDefault(); const d = e.target.closest && e.target.closest('#drop'); if (d) d.classList.add('over'); }));
['dragleave', 'drop'].forEach(ev => document.addEventListener(ev, e => { e.preventDefault(); const d = $('#drop'); if (d) d.classList.remove('over'); if (ev === 'drop' && e.dataTransfer && e.dataTransfer.files.length) addFiles([...e.dataTransfer.files]); }));

function exportCsv() {
  const { rows } = resultsData(), c = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const head = ['الصنف', 'رقم الصنف', ...files.flatMap(f => [f.name + ' - السعر', f.name + ' - الماركة']), 'الفرق', 'نسبة الفرق %', 'الأرخص عند'];
  const lines = rows.map(g => [g.desc, g.no, ...files.flatMap(f => { const x = g.cells[f.id]; return x ? [x.price, x.brand] : ['', '']; }), g.count > 1 ? g.diff : '', g.count > 1 ? g.pct.toFixed(1) : '', g.best.map(id => (files.find(f => f.id === id) || {}).name).join('، ')].map(c).join(','));
  const text = [head.map(c).join(','), ...lines].join('\r\n');

}
window.addEventListener('hashchange', () => { const p = location.hash.slice(1) === 'history' ? 'history' : 'compare'; if (p !== page) { page = p; render(); } });
$('#dlg-x').addEventListener('click', () => $('#dlg').close());

/* يوسّط حرفي OS داخل الدائرة بقياس الحروف الفعلية بعد تحميل الخط */
(function(){
  function fit(){
    try{
      var t=document.getElementById('os-mark'); if(!t) return;
      var c=document.createElement('canvas').getContext('2d');
      c.font='900 100px '+getComputedStyle(t).fontFamily;
      var m=c.measureText('OS'), a=m.actualBoundingBoxAscent, d=m.actualBoundingBoxDescent;
      if(!(a>0)) return;
      var size=100*31/(a+d);              // ارتفاع الحروف 25 وحدة
      t.setAttribute('font-size',size.toFixed(2));
      t.setAttribute('y',(41+(a-d)/2*size/100).toFixed(2)); // مركز الحروف عند مركز الدائرة
    }catch(e){}
  }
  if(document.fonts&&document.fonts.ready){document.fonts.ready.then(fit);}
  fit();
})();
