<style>
/* تخطيط: عمود واحد، منطقة رفع ثم جدول مقارنة عريض بعمود أول ثابت. الوضع الداكن فقط بقرار من المستخدم */
:root{
  --font-display:"Cairo","Segoe UI",Tahoma,sans-serif;
  --font-body:"Cairo","Segoe UI",Tahoma,system-ui,sans-serif;
  --bg:#0e0f10; --panel:#161718; --panel2:#1e2022; --line:#2d3033;
  --ink:#f3f1ea; --ink2:#a3a6a9; --accent:#ec4a40; --accent-ink:#fff; --accent-fill:#d6382f;
  --good:#46c795; --bad:#f0786a; --warn:#e9b44c;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15.5px;line-height:1.65}
button,input,select,textarea{font:inherit;color:inherit}
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;align-self:start;height:100vh;background:var(--panel);border-inline-end:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:22px}
.main{padding:24px 28px 60px;min-width:0;max-width:1400px;width:100%}
.brand{display:flex;align-items:center;justify-content:center;padding:4px 6px 0}
.brand .logo{display:block;flex:1 1 auto;width:100%;max-width:260px;aspect-ratio:262/84;height:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 17px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:#3a4752}
.btn.primary{background:var(--accent-fill);border-color:var(--accent-fill);color:var(--accent-ink);font-weight:700}
.btn.sm{padding:4px 11px;font-size:13.5px;border-radius:8px}
.btn.link{background:transparent;border-color:transparent;color:var(--ink2);text-decoration:underline;padding:4px 6px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.drop{border:2px dashed #34414b;border-radius:16px;background:var(--panel);padding:34px 20px;text-align:center;transition:border-color .15s,background .15s}
.drop.over{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--panel))}
.drop h2{margin:0 0 6px;font-size:21px;font-family:var(--font-display);font-weight:600}
.drop p{margin:0 0 16px;color:var(--ink2)}
.drop.mini{padding:14px 18px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;text-align:start}
.drop.mini p{margin:0}
.note{font-size:13px;color:var(--ink2);margin:10px 0 0}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;margin:14px 0;align-items:start}
.file{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.file .fh{display:flex;gap:10px;align-items:center}
.file .no{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13.5px;font-weight:700;background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.file input.nm{flex:1 1 auto;min-width:0;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-weight:700}
.file .x{flex:none;background:transparent;border:0;color:var(--ink2);cursor:pointer;font-size:13px;padding:4px 2px;text-decoration:underline;text-underline-offset:3px}
.file .x:hover{color:var(--bad)}
.file .fm{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13.5px;color:var(--ink2);padding-inline-start:38px}
.file .fm b{color:var(--ink);font-size:15px}
.file .warn{color:var(--warn);font-size:13.5px}
.file details{border-top:1px solid var(--line);padding-top:8px;margin-top:2px}
.file summary{cursor:pointer;color:var(--ink2);font-size:13.5px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:10px}
.cols label{display:block;font-size:12.5px;color:var(--ink2);margin-bottom:2px}
select,input[type=search],textarea,input[type=text]{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.kseg{display:flex;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;margin:0 0 14px;width:max-content;max-width:100%}
.kseg button{background:none;border:0;color:var(--ink2);font:inherit;font-weight:700;padding:8px 22px;border-radius:9px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.kseg button.on{background:var(--accent);color:#fff}
.kseg .n{font-size:12px;opacity:.85}
.cat .ct{text-transform:capitalize}
.sn{display:inline-block;min-width:26px;margin-inline-end:6px;padding:1px 6px;border-radius:6px;background:var(--panel2);color:var(--ink2);font-size:12px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
td.p.has{cursor:pointer}
#pop{position:fixed;z-index:60;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.45)}
#pop .btn{white-space:nowrap}
#offer tr.hl td,#offer tr.hl td:first-child{background:color-mix(in srgb,var(--accent) 28%,var(--panel))!important}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin:14px 0}
.qf1{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink2)}
.qf1 input,.qf1 textarea,.qf1 select,#q-mine,.qed input,.qed textarea{background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--ink);font:inherit;padding:8px 10px;min-width:0;width:100%}
.qf1.ck{flex-direction:row;align-items:center;align-self:end;padding-bottom:8px}.qf1.ck input{width:auto}
#q-mine{width:auto}
.qco{margin:6px 0 12px}.qco summary{cursor:pointer;color:var(--ink2)}
.qtw{max-height:420px;overflow:auto}
.qwarn{color:#ffb4a8;background:rgba(197,43,34,.18);border:1px solid rgba(197,43,34,.5);border-radius:8px;padding:4px 10px;font-size:13px;margin-inline-start:10px}
.qed td,.qed th{padding:4px 6px;white-space:nowrap}.qed textarea{resize:none;overflow:hidden;white-space:pre-wrap;line-height:1.5;min-width:220px;display:block;height:auto}.qpaper{transform-origin:top center}.qed input.sm{width:84px}.qed td .tt,.qed .tt{font-variant-numeric:tabular-nums;font-weight:700}
.qpaper{background:#fff;color:#15181c;max-width:820px;margin:0 auto;padding:34px 36px;border-radius:6px;box-shadow:0 8px 30px rgba(0,0,0,.35);font-size:13px;line-height:1.7}
.qpaper *{box-sizing:border-box}
.qpaper th:first-child,.qpaper td:first-child{position:static;min-width:0;max-width:none;box-shadow:none;background:transparent;font-size:inherit}.qpaper .qtb th:first-child{background:#15181c}.qpaper .qtb tbody tr.qg td:first-child{background:#f8dedb}.qpaper .qtot tr.g td:first-child{background:#c52b22}
.qed th:first-child,.qed td:first-child{position:static;min-width:0;max-width:none;box-shadow:none;width:34px}
.qpaper td,.qpaper th{background:transparent;color:inherit;border-inline:0}.qpaper table{background:#fff}.qpaper .qtb th{background:#15181c;color:#fff}.qpaper .qtb tbody tr.qg td{background:#f8dedb!important;color:#a8221a;font-size:11.5px;font-weight:800;padding:4px 10px;border-bottom:1px solid #ecb9b4;border-inline-start:4px solid #c52b22;break-after:avoid}.qtb tbody tr:not(.qg):nth-child(even) td{background:#e3e6e9}.qpaper .qtot tr.g td{background:#c52b22;color:#fff}
.qbr{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid #e6e8eb}
.qbp{display:flex;align-items:center;gap:14px}.qbp img.qsc{height:30px}.qbp img{height:40px;width:auto;object-fit:contain;display:block}
.qlogos{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin:6px 0 12px}.qlg1{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 10px}.qlg1 img{height:34px;max-width:90px;object-fit:contain;background:repeating-conic-gradient(#ccc 0 25%,#fff 0 50%) 0 0/10px 10px;border-radius:4px;padding:2px}
.qmeta{grid-template-columns:1fr!important}
.qh{display:flex;justify-content:space-between;align-items:center;gap:16px}
.qlg{width:190px}.qlg svg{width:100%;height:auto;display:block}
.qt{text-align:center;margin:0 0 14px}.qt b{display:block;font-size:14px;font-weight:900;color:#c52b22;line-height:1.3}.qkd{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:7px}.qkd i{height:1px;width:46px;background:linear-gradient(90deg,transparent,#a8221a)}.qkd i:last-child{background:linear-gradient(270deg,transparent,#a8221a)}.qkd.k-nissan i{background:linear-gradient(90deg,transparent,#111)}.qkd.k-nissan i:last-child{background:linear-gradient(270deg,transparent,#111)}
.qkd.k-nissan em{background:#111;border-color:#111;color:#fff}.qkd.k-nissan em small{color:#c3c7cc}
.qkd.k-mixed i:first-child{background:linear-gradient(90deg,transparent,#111)}.qkd.k-mixed i:last-child{background:linear-gradient(270deg,transparent,#a8221a)}
.qkd.k-mixed em{background:linear-gradient(90deg,#a8221a 0 50%,#111 50% 100%);border-color:#111}.qkd.k-mixed em small{color:#e4e6e8}
.qkd em small{display:block;font-size:7.5px;letter-spacing:1.4px;padding-left:1.4px;font-weight:700;color:#f6d3cf;direction:ltr;text-align:center;line-height:1.2;margin-top:1px;font-family:inherit;text-transform:uppercase}.qkd em{font-style:normal;font-size:10px;font-weight:800;color:#fff;border:1px solid #8f1a14;border-radius:11px;padding:1px 14px 2px;background:#a8221a;text-align:center;line-height:1.25}
.qt span{font-size:9px;letter-spacing:3px;color:#7a7f85;font-weight:700}
.qbar{height:4px;background:linear-gradient(90deg,#c52b22,#ec4a40 60%,#f3d4d1);border-radius:2px;margin:18px 0 16px}
.qmeta{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;margin-bottom:10px}
.qmeta>div{border:1px solid #dfe2e6;border-radius:6px;padding:3px 12px;background:#f7f8f9}
.qmeta h4{margin:0 0 2px;font-size:15px}.qmeta p{margin:0;color:#3a4047}
.qd{display:flex;justify-content:space-between;gap:20px}.qd p{display:flex;gap:6px;align-items:baseline;font-size:10.5px;line-height:1.5}.qd span{color:#7a7f85}
.qtb{width:100%;border-collapse:collapse;font-size:12.5px}
.qtb th{background:#15181c;color:#fff;padding:7px 8px;text-align:right;font-weight:700}
.qtb td{padding:6px 8px;border-bottom:1px solid #e6e8eb;vertical-align:top}
.qtb tbody tr:nth-child(even) td{background:#fafafa}
.qtb .qc{text-align:center}.qtb .qn1{text-align:center;width:130px;direction:ltr;font-variant-numeric:tabular-nums}.qtb .qno{direction:ltr;text-align:right;color:#555;white-space:nowrap}
.qtb th:first-child,.qtb td:first-child{width:1%;white-space:nowrap;padding-inline:16px 8px}.qtb th:nth-child(2),.qtb td.qno{width:1%;white-space:nowrap;padding-inline:6px 26px}
.qempty{padding:20px!important;color:#888}
.qtot[hidden]{display:none!important}
.qtot{display:flex;justify-content:flex-start;margin-top:14px;break-inside:avoid}
.qtot table{width:340px;min-width:0;border-collapse:collapse}
.qtot td{padding:5px 12px;border-bottom:1px solid #e6e8eb}.qtot td:last-child{text-align:left;direction:ltr;font-variant-numeric:tabular-nums;font-weight:700}
.qtot tr.g td{background:#c52b22;color:#fff;font-size:15px;font-weight:900;border:0}
.qn{margin-top:18px;break-inside:avoid}.qn h4{margin:0 0 4px;font-size:13px;color:#c52b22}.qn p{margin:0;white-space:pre-wrap;color:#3a4047;font-size:12px}
.qs{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:34px;break-inside:avoid}.qs div{border-top:1px solid #9aa0a6;padding-top:6px;text-align:center;color:#555;font-size:12px}
.qpg{width:100%;border-collapse:collapse;border:0;background:none}.qpaper .qpg>thead>tr>td,.qpaper .qpg>tbody>tr>td,.qpaper .qpg>tfoot>tr>td{padding:0!important;border:0!important;background:none!important;display:table-cell;white-space:normal;width:auto!important}.qpg>thead{display:table-header-group}.qpg>tfoot{display:table-footer-group}
.qft{margin-top:18px;border-top:2px solid #c52b22;background:#f4f5f7;border-radius:0 0 6px 6px;padding:5px 10px 6px;break-inside:avoid}
.qfa{display:flex;align-items:center;justify-content:center;gap:5px;font-weight:800;font-size:10px;color:#15181c;padding-bottom:3px;margin-bottom:4px;border-bottom:1px solid #dfe2e6}
.qfa svg{width:12px;height:12px;stroke:#c52b22;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.qfc .ib{width:12px;height:12px;display:flex;align-items:center;justify-content:center;flex:none}
.qfc .ib svg{width:11px;height:11px;stroke:#c52b22;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.qfg{display:grid;grid-template-columns:repeat(3,1fr);gap:3px 10px}
.qfc{display:block;min-width:0;padding-inline:6px}
.qfc small{display:flex;align-items:center;gap:4px;font-size:8px;color:#7a7f85;font-weight:700;line-height:1.15}
.qfc b{display:block;font-size:10px;color:#15181c;font-weight:800;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;line-height:1.25}
.qf{margin-top:22px;padding-top:8px;border-top:2px solid #c52b22;text-align:center;color:#555;font-size:11.5px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:18px 0}
.tile{min-width:0;overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.tile .l{font-size:13px;color:var(--ink2)}
.tile .v{font-family:var(--font-display);font-size:26px;line-height:1.3;font-variant-numeric:tabular-nums}
.tile .v .bn{white-space:normal;overflow-wrap:anywhere}
.tile .s{font-size:12.5px;color:var(--ink2)}
.tool{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:6px 0 12px}
.tool .grow{flex:1 1 240px}
.tool select{width:auto}
label.chk{display:inline-flex;gap:8px;align-items:center;color:var(--ink2);cursor:pointer}
input[type=checkbox]{accent-color:var(--accent)}
.cats{display:flex;flex-direction:column;gap:8px}
.cat{border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}
.cat>button.ch{all:unset;box-sizing:border-box;display:flex;width:100%;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;font-family:inherit;color:var(--ink)}
.cat>button.ch:hover{background:var(--panel2)}
.cat>button.ch:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.cat .ct{font-weight:700;font-size:16px}
.cat .cm{color:var(--ink2);font-size:13.5px}
.cat .cg{margin-inline-start:auto;transition:transform .15s;color:var(--ink2);display:grid}
.cat.open .cg{transform:rotate(180deg)}
.cat .tw{border:0;border-top:1px solid var(--line);border-radius:0;max-height:70vh}
.tw{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel);max-height:72vh}
table{border-collapse:separate;border-spacing:0;width:100%}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:start;vertical-align:middle}
thead th{position:sticky;top:0;z-index:3;background:var(--panel2);color:var(--ink2);font-weight:500;font-size:13.5px;white-space:nowrap}
thead th.co{white-space:normal;line-height:1.25;min-width:84px;max-width:130px;font-size:13px;padding:8px 8px;color:var(--ink);font-weight:700;background:color-mix(in srgb,var(--c) 38%,var(--panel2))}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-inline-end:5px;vertical-align:baseline}
td.p.has{background:color-mix(in srgb,var(--c) 20%,var(--panel));border-bottom-color:var(--panel);border-inline-start:2px solid var(--panel)}
td.p.best.has b{color:var(--ink)}
.mk{display:inline-block;vertical-align:middle;margin-inline-start:5px}
.mk.sq{width:9px;height:9px;border-radius:2px;background:var(--good)}
.mk.tri{margin-inline-end:6px;width:0;height:0;border-inline:5px solid transparent;border-bottom:9px solid var(--bad)}
.bn{display:inline-flex;align-items:center;margin-inline-end:10px;white-space:nowrap}
.file{background:color-mix(in srgb,var(--c,var(--panel)) 12%,var(--panel))}
.file .no{background:var(--c);color:#111}
th:first-child,td:first-child{position:sticky;inset-inline-start:0;z-index:2;background:var(--panel);min-width:190px;max-width:260px;box-shadow:-1px 0 0 var(--line)}
thead th:first-child{z-index:4;background:var(--panel2)}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#192026}
tbody tr:hover td:first-child{background:#192026}
td.p{min-width:84px;padding:7px 8px;white-space:normal;line-height:1.3}
td.p b{font-variant-numeric:tabular-nums;font-size:17px;white-space:nowrap}
table.dense td.p{min-width:68px;padding:6px 5px}
table.dense td.p b{font-size:15.5px}
table.dense td.p .b{max-width:66px;font-size:10.5px}
table.dense thead th.co{min-width:68px;max-width:100px;font-size:12px;padding:7px 5px}

table.dense th,table.dense td{padding-inline:6px}
td.p .b{font-size:11.5px;color:var(--ink2);max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
td.p .u{unicode-bidi:isolate;direction:ltr;display:inline-block;font-size:11.5px;color:var(--bad);margin-inline-start:3px;font-variant-numeric:tabular-nums}
.no{font-size:12.5px;color:var(--ink2);direction:ltr;text-align:start}
.diff b{font-size:16.5px;font-variant-numeric:tabular-nums}
.chip{display:inline-block;padding:0 9px;border-radius:99px;font-size:12.5px;border:1px solid var(--line);background:var(--panel2);color:var(--ink2)}
.chip.hi{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line));background:color-mix(in srgb,var(--bad) 12%,transparent)}
.chip.mid{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,var(--line));background:color-mix(in srgb,var(--warn) 12%,transparent)}
.chip.lo{color:var(--good);border-color:color-mix(in srgb,var(--good) 40%,var(--line));background:color-mix(in srgb,var(--good) 12%,transparent)}
.mut{color:#5e6b76}
.paste{margin-top:14px;text-align:start}
.paste textarea{min-height:110px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);padding:0;width:min(760px,calc(100% - 24px))}
dialog::backdrop{background:rgba(5,8,10,.65)}
#offer{width:min(980px,calc(100% - 20px))}
#offer .b{padding:12px 16px}
#offer .tw{max-height:62vh}
.file .op{flex:none;padding:4px 12px;font-size:13.5px}
dialog .h{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
dialog .h b{font-family:var(--font-display);font-size:18px;font-weight:600}
dialog textarea{min-height:260px;direction:ltr;text-align:left;font-family:ui-monospace,Consolas,monospace;font-size:13px}

const CAT_MAP = { 'مقصات': 'مقص', 'فلترهواء': 'فلتر', 'فحمه': 'فحمات', 'جلدهعكس': 'جلده', 'تماتيك': 'اتماتيك', 'رومان': 'رمان', 'روماني': 'رمان', 'رومانه': 'رمان', 'رومانات': 'رمان', 'رماني': 'رمان', 'رمانه': 'رمان', 'رمانات': 'رمان', 'باكم': 'قماش', 'مساعدات': 'مساعد' };

const qEnd = () => { const d = new Date((Q.date || qToday()) + 'T00:00:00'); d.setDate(d.getDate() + (+Q.valid || 0)); return d.toISOString().slice(0, 10); };
function qTotals() {
  const sel = Q.items.filter(i => i.on), sub = sel.reduce((a, i) => a + (+i.qty || 0) * (+i.price || 0), 0), disc = sub * Math.min(100, Math.max(0, +Q.disc || 0)) / 100, net = sub - disc, vat = Q.vat ? net * 0.15 : 0;
  return { sel, sub, disc, net, vat, total: net + vat };
}

  <h3 style="margin:18px 0 8px">معاينة العرض</h3><div id="qpaper" class="qpaper">${qPaper()}</div></div>`;

const qUndo = [];

const qGrow = el => { if (window.innerWidth > 760) { el.style.height = ''; return; } el.style.height = 'auto'; el.style.height = el.scrollHeight + 2 + 'px'; };

function qRefresh() { qUndoBtn(); qFit(); const p = $('#qpaper'); if (p) p.innerHTML = qPaper(); const c = $('#q-count'); if (c) c.textContent = qTotals().sel.length + ' صنف في العرض من ' + Q.items.length + (qKind() ? ' · النوع: ' + QKIND[qKind()] + (Q.kind ? '' : ' (تلقائي)') : ''); const nb = document.querySelector('[data-qact=new]'); if (nb) nb.classList.toggle('dim', !Q.items.some(i => String(i.desc).trim())); const w = $('#q-warn'); if (w) { w.textContent = qWarn(); w.hidden = !w.textContent; } qSave(); }
async function qImport(list) {

const QKIND = { nissan: 'نيسان', toyota: 'تويوتا', mixed: 'نيسان وتويوتا' };

  return d === 'mixed' ? 'تنبيه: الأصناف تبدو مختلطة بين نيسان وتويوتا، والنوع المختار ' + QKIND[Q.kind] + '.' : 'تنبيه: معظم الأصناف تبدو ' + QKIND[d] + '، والنوع المختار ' + QKIND[Q.kind] + '.';

function qPdf() {
  if (window.self !== window.top && !/github\.io$/.test(location.hostname)) { toast('الطباعة لا تعمل داخل هذه النافذة. افتح الموقع من رابط GitHub ثم اضغط حفظ العرض PDF.'); return; }

/* يوسّط حرفي OS داخل الدائرة بقياس الحروف الفعلية بعد تحميل الخط */
(function(){
  function fit(){
    try{
      var t=document.getElementById('os-mark'); if(!t) return;
      var c=document.createElement('canvas').getContext('2d');
      c.font='900 100px '+getComputedStyle(t).fontFamily;
      var m=c.measureText('OS'), a=m.actualBoundingBoxAscent, d=m.actualBoundingBoxDescent;
      if(!(a>0)) return;
      var size=100*31/(a+d);              // ارتفاع الحروف 25 وحدة
      t.setAttribute('font-size',size.toFixed(2));
      t.setAttribute('y',(41+(a-d)/2*size/100).toFixed(2)); // مركز الحروف عند مركز الدائرة
    }catch(e){}
  }
  if(document.fonts&&document.fonts.ready){document.fonts.ready.then(fit);}
  fit();
})();
{ const tb = document.getElementById('totop'), chk = () => { tb.hidden = (window.scrollY || document.documentElement.scrollTop) < 300; };
