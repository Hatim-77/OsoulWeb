:root{
  --font-display:"Cairo","Segoe UI",Tahoma,sans-serif;
  --font-body:"Cairo","Segoe UI",Tahoma,system-ui,sans-serif;
  --bg:#0e0f10; --panel:#161718; --panel2:#1e2022; --line:#2d3033;
  --ink:#f3f1ea; --ink2:#a3a6a9; --accent:#ec4a40; --accent-ink:#fff; --accent-fill:#d6382f;
  --good:#46c795; --bad:#f0786a; --warn:#e9b44c;

}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15.5px;line-height:1.65}
button,input,select,textarea{font:inherit;color:inherit}
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;align-self:start;height:100vh;background:var(--panel);border-inline-end:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:22px}
.main{padding:24px 28px 60px;min-width:0;max-width:1400px;width:100%}
.brand{display:flex;align-items:center;justify-content:center;padding:4px 6px 0}

:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.drop{border:2px dashed #34414b;border-radius:16px;background:var(--panel);padding:34px 20px;text-align:center;transition:border-color .15s,background .15s}

.qtw{max-height:420px;overflow:auto}

.qfold{display:flex;align-items:center;gap:10px;width:100%;margin:0;padding:11px 14px;background:var(--panel,#1a1b1c);border:1px solid var(--line,#2c2d2f);border-radius:10px;color:inherit;font:inherit;cursor:pointer;text-align:right}
.qfold b{font-size:15px;flex:1}.qfold .qcnt{font-size:13px;opacity:.7}.qfold .qar{transition:transform .2s}.qfold.shut .qar{transform:rotate(90deg)}.qfold:hover{border-color:#e03b3b}
.qwarn{color:#ffb4a8;background:rgba(197,43,34,.18);border:1px solid rgba(197,43,34,.5);border-radius:8px;padding:4px 10px;font-size:13px;margin-inline-start:10px}
.qed td,.qed th{padding:4px 6px;white-space:nowrap}.qed textarea{resize:none;overflow:hidden;white-space:pre-wrap;line-height:1.5;min-width:220px;display:block;height:auto}.qpaper{transform-origin:top center}.qed input.sm{width:84px}.qed td .tt,.qed .tt{font-variant-numeric:tabular-nums;font-weight:700}
.qpaper{background:#fff;color:#15181c;max-width:820px;margin:0 auto;padding:34px 36px;border-radius:6px;box-shadow:0 8px 30px rgba(0,0,0,.35);font-size:13px;line-height:1.7}

.qlogos{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin:6px 0 12px}.qlg1{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 10px}.qlg1 img{height:34px;max-width:90px;object-fit:contain;background:repeating-conic-gradient(#ccc 0 25%,#fff 0 50%) 0 0/10px 10px;border-radius:4px;padding:2px}

let printing = false;
function savePdf(sel) {
  if (window.self !== window.top && !/github\.io$/.test(location.hostname)) { toast('الطباعة لا تعمل داخل هذه النافذة. افتح الموقع من رابط GitHub ثم اضغط حفظ PDF.'); return; }
  if (printing) return; printing = true; setTimeout(() => { printing = false; }, 8000);
  /* يُطبع ما هو مفتوح من الأقسام؛ فإن لم يُفتح شيء تُفتح كلها مؤقتاً */
  const wasFlat = ui.flat; if (sel && ui.flat) { ui.flat = false; refreshResults(); }
  const keys = [...document.querySelectorAll('.cat > button.ch')].map(b => b.dataset.cat), had = new Set(ui.open), none = !!sel || (!keys.some(k => ui.open.has(k)) && !ui.q.trim());
  if (sel) { ui.open = new Set(keys.filter(k => sel.has(k))); refreshResults(); } else if (none) { keys.forEach(k => ui.open.add(k)); refreshResults(); }
  const title = document.title; document.title = 'مقارنة الأسعار' + (sel && sel.size === 1 ? ' - ' + dlName([...sel][0]) : '') + ' - ' + new Date().toLocaleDateString('en-CA');
  const done = () => { printing = false; document.title = title; if (none) { ui.open = had; } if (sel) ui.flat = wasFlat; if (none || sel) refreshResults(); window.removeEventListener('afterprint', done); };
  window.addEventListener('afterprint', done);
  setTimeout(() => { try { window.print(); } catch (e) { toast('تعذرت الطباعة هنا. افتح الموقع من رابط GitHub.'); done(); } }, 150);
}
function downloadXlsx() {

}
/* نافذة تنزيل أقسام محددة (المقارنة وعرض السعر) */
function dlOpen(kind) {

/* تنزيل عرض السعر الحالي بصيغة Excel (الأقسام المختارة فقط إن حُدّدت) */

  const ws = XLSX.utils.aoa_to_sheet(aoa); ws['!cols'] = [{ wch: 16 }, { wch: 22 }, { wch: 46 }, ...(hasBrand ? [{ wch: 16 }] : []), { wch: 12 }, ...(Q.gen ? [] : [{ wch: 9 }, { wch: 12 }])];
  const wb = XLSX.utils.book_new(); wb.Workbook = { Views: [{ RTL: true }] }; XLSX.utils.book_append_sheet(wb, ws, 'عرض السعر');
  const nm = String(qDocTitle()).replace(/[\\/:*?"<>|]/g, '-') + (DLS && DLS.size === 1 ? ' - ' + dlName([...DLS][0]) : '');
  try { XLSX.writeFile(wb, nm + '.xlsx'); toast('جارٍ تنزيل ملف Excel'); } catch (e) { toast('تعذر التنزيل هنا. جرّب مرة أخرى من رابط GitHub.'); }
}
